[project]
name = "communeer"
version = "0.1.0"
description = "Communeer backend — self-hosted WhatsApp-community admin dashboard API"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.28",
    "pyotp>=2.10.0",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
# Alembic-generated migration boilerplate doesn't follow project lint rules
# and is regenerated on each new migration — exclude it from linting.
exclude = ["migrations"]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as an argument default is the intended,
# idiomatic pattern for this framework, not a bug.
ignore = ["B008"]
