services:
  wppconnect:
    image: wppconnect/wppconnect-server:latest
    restart: unless-stopped
    environment:
      PORT: "21465"
      SECRET_KEY: "${SECRET_KEY:?set a SECRET_KEY in .env}"
      TOKEN_STORE_TYPE: file
      CUSTOM_USER_DATA_DIR: "/usr/src/wpp-server/userDataDir/"
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_user_data:/usr/src/wpp-server/userDataDir
    ports:
      # localhost-only: this port must never be reachable from outside the dev machine
      - "127.0.0.1:21465:21465"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:21465/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  wppconnect_tokens: {}
  wppconnect_user_data: {}
